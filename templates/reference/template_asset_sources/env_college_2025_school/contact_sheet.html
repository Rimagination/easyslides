<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PPTX Template Source Contact Sheet</title>
  <style>
    body { margin: 24px; font-family: Arial, sans-serif; background: #f6f7f9; color: #151515; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .slide { margin: 0; padding: 12px; background: white; border: 1px solid #d8dde6; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fff; }
    figcaption { margin-top: 8px; font-size: 13px; color: #4d5562; }
  </style>
</head>
<body>
  <h1>PPTX Template Source Contact Sheet</h1>
  <div class="grid">
<figure class="slide">
  <img src="svg-flat/slide_01.svg" alt="Slide 1">
  <figcaption>Slide 1: cover</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_02.svg" alt="Slide 2">
  <figcaption>Slide 2: chapter</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_03.svg" alt="Slide 3">
  <figcaption>Slide 3: content</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_04.svg" alt="Slide 4">
  <figcaption>Slide 4: content</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_05.svg" alt="Slide 5">
  <figcaption>Slide 5: content</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_06.svg" alt="Slide 6">
  <figcaption>Slide 6: content</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_07.svg" alt="Slide 7">
  <figcaption>Slide 7: content</figcaption>
</figure>
<figure class="slide">
  <img src="svg-flat/slide_08.svg" alt="Slide 8">
  <figcaption>Slide 8: ending</figcaption>
</figure>
  </div>
</body>
</html>
